/* Layout: phone first. A slim masthead, one working surface (map, planner or almanac),
   and a bottom tab bar. On the map, a conditions pill floats on top and the spot sheet
   slides up from the bottom. On wide screens the sheet becomes a right-hand panel. */
:root{
  --paper:#F1E5BC; --paper-2:#F8F0D4; --paper-3:#E8D9A6;
  --ink:#1D2620; --ink-2:#5B573F; --rule:#CBB880;
  --lake:#1E4C77; --leaf:#2E6740; --fin:#B0432D; --gold:#C29224;
  --r0:#8E8870; --r1:#B0432D; --r2:#C8752A; --r3:#C79F24; --r4:#6B9539; --r5:#2E6740;
  --map-ink:#F8F0D4;
  --f-display:"Libre Caslon Display","Libre Caslon Text",Georgia,serif;
  --f-head:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --f-old:"IM Fell English","Libre Caslon Text",Georgia,serif;
  --f-ui:"Libre Franklin",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --nav-h:58px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:4000;background:var(--lake)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
a{color:var(--lake)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}

/* Masthead */
.mast{background:var(--lake);color:var(--map-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:9px;display:flex;align-items:center;gap:16px}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px;white-space:nowrap}
.tabs{display:flex}
.tabs a{text-decoration:none;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.tabs svg{width:20px;height:20px}

/* Bottom nav (phone) */
.bottomnav{background:var(--paper-2);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav .tabs{height:var(--nav-h)}
.bottomnav .tabs a{flex:1;flex-direction:column;justify-content:center;gap:3px;color:var(--ink-2);font-size:11.5px}
.bottomnav .tabs a[aria-current="page"]{color:var(--lake)}
.bottomnav .tabs a[aria-current="page"] svg{stroke-width:2.4}
.mast .tabs{display:none}

main{min-height:0;position:relative}
.view{position:absolute;inset:0}
.view[hidden]{display:none!important}

/* Conditions pill */
.condpill{position:absolute;z-index:1200;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--ink-2);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.35);font-weight:600;font-size:13.5px;white-space:nowrap}
.condpill svg{width:22px;height:22px;flex:none}
.condpill .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.condpill .dot{width:8px;height:8px;border-radius:50%;background:var(--r0);flex:none}
.condpill .dot.on{background:var(--r5)}
.condpill .chev{opacity:.6;font-size:12px}
.flag{position:absolute;z-index:1150;top:56px;left:50%;transform:translateX(-50%);background:var(--fin);color:#fff;font-weight:600;font-size:12.5px;padding:5px 12px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* Map */
#map{position:absolute;inset:0;background:#1b2618}
.leaflet-container{font-family:var(--f-ui)}
.leaflet-control-attribution{font-size:9.5px;background:rgba(248,240,212,.8)!important;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-top{top:56px}
.pinw{position:relative}
.pin{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;border:3px solid var(--paper-2);display:grid;place-items:center;color:#fff;font:700 16px/1 var(--f-ui);box-shadow:0 2px 8px rgba(0,0,0,.55);padding:0;transition:transform .15s}
.pin.sel{transform:scale(1.18);outline:3px solid var(--gold);outline-offset:2px}
.pin.r0{background:var(--r0)}.pin.r1{background:var(--r1)}.pin.r2{background:var(--r2)}.pin.r3{background:var(--r3)}.pin.r4{background:var(--r4)}.pin.r5{background:var(--r5)}
.plabel{position:absolute;left:25px;top:-14px;white-space:nowrap;font:600 13px/1.2 var(--f-ui);color:var(--map-ink);text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none}
.plabel i{display:block;font-style:normal;font-weight:500;font-size:11.5px;opacity:.92}
.shop{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:4px;background:var(--paper-2);border:2px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.5)}

/* Sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1300;background:var(--paper);border-top:1px solid var(--ink-2);border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.35);display:flex;flex-direction:column;height:150px;transition:height .25s ease;touch-action:none}
.sheet.drag{transition:none}
.sheet-head{padding:6px 18px 10px;cursor:grab;touch-action:none;user-select:none}
.grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--rule);margin:2px auto 10px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 18px 28px;touch-action:pan-y;flex:1;min-height:0}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.stitle{font-family:var(--f-head);font-size:24px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sub{font-size:14px;color:var(--ink-2);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hooks{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.hooks svg{width:22px;height:12px}
.closebtn{float:right;border:1px solid var(--rule);background:var(--paper-2);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1;margin:-2px -4px 0 8px}
.stack{display:flex;flex-direction:column;gap:14px}
.spotrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;border:1px solid var(--rule);background:var(--paper-2);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.spotrow .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.spotrow b{display:block;font-size:15px}
.spotrow small{color:var(--ink-2);font-size:12.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--lake);background:var(--lake);color:var(--map-ink);flex:1;min-height:46px}
.btn.ghost{background:transparent;color:var(--lake)}
.about{font-size:14.5px;margin:0}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font-size:12.5px;border-radius:999px;padding:3px 10px;background:#D7E5C4;color:#244F31}
.rchip.neg{background:#F1D3C6;color:#86301F}

/* Hour strip */
.strip{background:var(--paper-2);border:1px solid var(--rule);border-radius:14px;padding:10px 12px}
.strip-grid{display:grid;grid-template-columns:42px repeat(var(--n),minmax(0,1fr));gap:3px;align-items:center;margin-top:8px}
.strip-grid .lab{font-size:11px;font-weight:600;color:var(--ink-2)}
.strip-grid button{height:22px;border:0;border-radius:4px;padding:0}
.strip-grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.strip-hours{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);margin-left:45px;margin-top:4px;font-variant-numeric:tabular-nums}

/* Species block */
.sp{border-top:2px solid var(--ink);padding-top:12px}
.sp-head{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center}
.sp-head img{width:86px;height:44px;object-fit:contain}
.sp-head h3{margin:0;font-family:var(--f-head);font-size:20px;line-height:1.1}
.sp-head .sub{margin-top:2px;font-size:13px}
.closednote{background:#F1D3C6;color:#86301F;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;margin-top:10px}
.lure{margin-top:10px;background:var(--paper-2);border:1px solid var(--rule);border-radius:14px;overflow:hidden}

// ---------- State ----------
const todayYmd = ymdOf(new Date());
const S = { dayIdx: 0, minute: 0, manual: store.get('manual', {}), wx: null, wxState: 'idle', wxMsg: '', spot: null, view: 'map', open: {} };
function dayYmd() { return addDays(todayYmd, S.dayIdx); }
function sunFor(ymd) { return E.sunTimes(localDate(ymd, 720), E.LAKE.lat, E.LAKE.lng); }
function legalMinutes(ymd) { const sun = sunFor(ymd); const w = E.legalWindow(sun); return { a: Math.floor(minutesOf(w.start) / 15) * 15, b: Math.floor(minutesOf(w.end) / 15) * 15, sun }; }
(function initTime() {
  const nowMin = minutesOf(new Date()); const L = legalMinutes(todayYmd);
  if (nowMin < L.a) { S.minute = Math.round((minutesOf(L.sun.rise) + 30) / 15) * 15; }
  else if (nowMin > L.b) { S.dayIdx = 1; const L2 = legalMinutes(addDays(todayYmd, 1)); S.minute = Math.round((minutesOf(L2.sun.rise) + 30) / 15) * 15; S.note = 'Showing tomorrow: today\'s fishing hours are over.'; }
  else S.minute = Math.round(nowMin / 15) * 15;

function wxKey(ymd, min) { return `${ymd}T${String(Math.floor(min / 60)).padStart(2, '0')}:00`; }
function wxAt(ymd, min) {
  if (!S.wx) return null;

  const p = S.wx.hourly[wxKey(ymd, Math.max(0, min - 180))];
  const sky = h.precip >= 0.2 ? 'rain' : h.cloud < 30 ? 'sun' : h.cloud < 70 ? 'part' : 'cloud';
  const wind = h.wind < 8 ? 'calm' : h.wind <= 20 ? 'breeze' : 'windy';
  let pressure = 'steady'; if (p && h.press != null && p.press != null) { const d = h.press - p.press; pressure = d < -1 ? 'falling' : d > 1 ? 'rising' : 'steady'; }

function condsAt(ymd, min) {
  const live = wxAt(ymd, min); const base = live || { sky: 'part', wind: 'breeze', pressure: 'steady' }; const m = S.manual;

  const best = !bass.legal.ok ? (carp.legal.ok ? 'carp' : 'bass') : (carp.legal.ok && carp.raw > bass.raw ? 'carp' : 'bass');

// ---------- Live weather (Open-Meteo) ----------
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=39.62&longitude=-8.27&hourly=cloud_cover,wind_speed_10m,precipitation,pressure_msl,temperature_2m&forecast_days=3&past_days=1&timezone=Europe%2FLisbon';
async function fetchWeather() {
  if (S.wxState === 'busy') return;
  S.wxState = 'busy'; if (!$('#scrim').hidden) renderConditions();
  try {
    const r = await fetch(WX_URL); if (!r.ok) throw { code: 'http' };
    const H = (await r.json()).hourly, hourly = {};
    H.time.forEach((t, k) => { hourly[t] = { cloud: H.cloud_cover[k], wind: H.wind_speed_10m[k], precip: H.precipitation[k], press: H.pressure_msl[k], temp: H.temperature_2m[k] }; });
    S.wx = { hourly, fetchedAt: Date.now() }; S.wxState = 'ok';
  } catch (e) {

// ---------- Sheet ----------
const sheet = $('#sheet');
const peekH = () => 132;
const halfH = () => Math.round($('main').clientHeight * 0.56);
const fullH = () => $('main').clientHeight - 8;
let sheetState = 'peek';
function setSheet(st) { sheetState = st; if (isWide()) { sheet.style.height = ''; return; } sheet.style.height = (st === 'peek' ? peekH() : st === 'half' ? halfH() : fullH()) + 'px'; }
(function dragSheet() {
  const head = $('#sheethead'); let y0 = null, h0 = 0, moved = false;
  head.addEventListener('pointerdown', e => { if (isWide() || e.target.closest('button,a')) return; y0 = e.clientY; h0 = sheet.offsetHeight; moved = false; sheet.classList.add('drag'); head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if (y0 == null) return; const dy = e.clientY - y0; if (Math.abs(dy) > 4) moved = true; sheet.style.height = Math.max(peekH() - 40, Math.min(fullH(), h0 - dy)) + 'px'; });
  const end = () => { if (y0 == null) return; sheet.classList.remove('drag'); const h = sheet.offsetHeight; y0 = null;
    if (!moved) { setSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'half'); return; }
    const opts = [['peek', peekH()], ['half', halfH()], ['full', fullH()]]; opts.sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h)); setSheet(opts[0][0]); };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
})();

function lureFull(r, c, rank) {

function hourStrip(spot) {
  const ymd = dayYmd(); const L = legalMinutes(ymd);

  const curH = Math.floor(S.minute / 60) * 60;
  const rows = ['bass', 'carp'].map(k => `<span class="lab">${k === 'bass' ? 'Bass' : 'Carp'}</span>` + hours.map(m => { const c = condsAt(ymd, at(m)); const ev = E.evaluate(spot, Object.assign({}, c, { species: k })); const r = ev.legal.ok ? ev.rating : 0; return `<button class="${m === curH ? 'cur' : ''}" style="background:${RCOL[r]}" data-hm="${at(m)}" aria-label="${k} at ${hhmm(m)}: ${RWORD[r]}"></button>`; }).join('')).join('');
  const marks = [hours[0], hours[Math.floor(hours.length / 2)], hours[hours.length - 1]];
  return `<div class="strip"><div class="eyebrow">${dayName(ymd, S.dayIdx)} at this spot</div><div class="strip-grid" style="--n:${hours.length}">${rows}</div><div class="strip-hours">${marks.map(m => `<span>${hhmm(m)}</span>`).join('')}</div></div>`;
}

function selectSpot(id) {

function renderPlanner() {
  const ymd = dayYmd(); const L = legalMinutes(ymd);
  const hours = []; for (let m = Math.floor(L.a / 60) * 60; m < L.b; m += 60) hours.push(m);
  const at = m => Math.max(L.a, Math.min(L.b - 15, m + 30));
  const riseH = Math.floor(minutesOf(L.sun.rise) / 60) * 60, setH = Math.floor(minutesOf(L.sun.set) / 60) * 60;
  const curH = Math.floor(S.minute / 60) * 60;
  const grid = hours.map(m => { const c = condsAt(ymd, at(m)); return { m, c, res: E.SPOTS.map(s => both(s, c)) }; });
  const short = { jig: 'Jig', texas: 'Texas', dropshot: 'Drop', ned: 'Ned', spinner: 'Spin', lipless: 'Lipless', crank: 'Crank', jerk: 'Jerk', topwater: 'Top', swim: 'Swim', tiger: 'Tiger', boilie: 'Boilie', particles: 'Maize', popup: 'Pop-up', surface: 'Surface' };
  const cells = []; grid.forEach(g => g.res.forEach(r => { if (r.rating) cells.push({ m: g.m, r }); }));
  cells.sort((a, b) => b.r.rating - a.r.rating || b.r.top.raw - a.r.top.raw);
  const wins = []; const used = new Set();
  for (const x of cells) {
    if (wins.length >= 3) break; const id = x.r.top.spot.id; if (used.has(id)) continue;
    const col = grid.map(g => g.res.find(r => r.top.spot.id === id));
    const idx = grid.findIndex(g => g.m === x.m); let a = idx, b = idx;
    while (a > 0 && col[a - 1].rating >= x.r.rating) a--; while (b < col.length - 1 && col[b + 1].rating >= x.r.rating) b++;
    wins.push({ r: x.r, a: grid[a].m, b: grid[b].m + 60 }); used.add(id);
  }
  const head = '<span></span>' + E.SPOTS.map(s => `<span class="h">${esc(s.short.replace('The ', ''))}</span>`).join('');
  const rowsH = grid.map(g => `<span class="tm">${hhmm(g.m)}${g.m === riseH ? '<span class="sunmark" title="Sunrise">↑</span>' : g.m === setH ? '<span class="sunmark" title="Sunset">↓</span>' : ''}</span>` +
    g.res.map(r => `<button class="${g.m === curH ? 'cur' : ''}" style="background:${RCOL[r.rating]}" data-s="${r.top.spot.id}" data-m="${at(g.m)}" aria-label="${esc(r.top.spot.name)} ${hhmm(g.m)}: ${RWORD[r.rating]}">${r.rating || '–'}<small>${r.rating ? (r.best === 'bass' ? 'B' : 'C') + ' ' + short[r.top.lures[0].lure.id] : ''}</small></button>`).join('')).join('');
  $('#planner').innerHTML = `<div class="eyebrow">${dayName(ymd, S.dayIdx)} · fishing hours ${hhmm(L.a)}–${hhmm(L.b)}</div>
    <h1>Best times and places</h1>
    <div class="condline"><button class="condpill" aria-haspopup="dialog">${pillHTML(condsAt(ymd, S.minute))}</button></div>
    ${wins.length ? `<div class="windows">${wins.map(w => `<button class="win" data-s="${w.r.top.spot.id}" data-m="${at(w.a)}"><img src="${w.r.top.lures[0].lure.photo}" alt=""><span><span class="t">${hhmm(w.a)}–${hhmm(Math.min(w.b, L.b))}</span><b>${esc(w.r.top.spot.name)}</b><small>${hooks(w.r.rating)} ${SPECIES[w.r.best].name} · ${esc(w.r.top.lures[0].lure.name)}</small></span></button>`).join('')}</div>` : ''}
    <div class="heat"><div class="hgrid">${head}${rowsH}</div></div>
    <div class="keyrow">${[1, 2, 3, 4, 5].map(n => `<span><i style="background:${RCOL[n]}"></i>${RWORD[n]}</span>`).join('')}<span>B bass · C carp</span><span class="sunmark">↑ sunrise ↓ sunset</span></div>
    <p class="lede" style="font-size:13px">${S.wx ? 'Each hour uses the live hourly forecast.' : 'Every hour uses the same conditions. Load the live forecast for hour-by-hour weather.'} Tap a square to open that spot at that time.</p>`;
  $('#planner .condpill').onclick = openConditions;
  $('#planner').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.minute = Math.round(+b.dataset.m / 15) * 15; location.hash = '#map'; setView('map'); selectSpot(b.dataset.s); });
}

  <section id="ch1" class="chapter"><div class="num">Chapter I</div><h2>The Black Bass</h2>

  <section id="ch5" class="chapter"><div class="num">Chapter V</div><h2>The Lures and Baits</h2>

  <section id="ch6" class="chapter"><div class="num">Chapter VI</div><h2>Rules of the Water</h2>
    <div class="chap-grid"><table class="rules"><tbody>
      <tr><th>Licence</th><td>Inland recreational licence from ICNF, regional (Centro) or national.</td></tr>
      <tr><th>Hours</th><td>30 min before sunrise to 30 min after sunset. No night fishing.</td></tr>
      <tr><th>Black bass</th><td>Closed 16 March to 14 May. Minimum 20 cm.</td></tr>
      <tr><th>Barbel and boga</th><td>Closed 16 March to 14 June. Barbel 20 cm, boga 15 cm.</td></tr>
      <tr><th>Carp</th><td>Open all year, no minimum size.</td></tr>
      <tr><th>Pike</th><td>Must not be returned alive.</td></tr>
      <tr><th>Shad</th><td>Professional fishers only: release it.</td></tr>
      <tr><th>Dam</th><td>No fishing within 150 m of the dam, intakes and outlets.</td></tr>

// ---------- Views and updates ----------
function setView(v) {
  S.view = v;
  document.querySelectorAll('.view').forEach(el => el.hidden = el.dataset.v !== v);
  document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.view === v ? 'page' : 'false'));
  if (v === 'map') setTimeout(() => { map.invalidateSize(); setSheet(sheetState); if (!fitted) { fitSpots(); fitted = true; } }, 0);
  if (v === 'planner') renderPlanner();
}
function fromHash() { const h = (location.hash || '#map').slice(1); setView(['map', 'planner', 'almanac'].includes(h) ? h : 'map'); }
window.addEventListener('hashchange', fromHash);
function update() { const c = renderPills(); renderMap(c); renderSheet(c); if (S.view === 'planner') renderPlanner(); }
let raf = null;
function scheduleUpdate() { cancelAnimationFrame(raf); raf = requestAnimationFrame(update); }
$('#pill-map').onclick = openConditions;
window.addEventListener('resize', () => setSheet(sheetState));

let fitted = false;
renderAlmanac();
update();
setSheet('peek');
fromHash();
fetchWeather();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
